name: ARN 1.0.4 release candidate Linux verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: python -m venv .venv
      - run: |
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -c "import sys,importlib.metadata as m; assert sys.version_info[:3] == (3,14,4); assert m.version('mcp') == '2.3.0'"
      - name: Synthetic library, consumer, contract, quota and payment regressions
        run: .venv/bin/python -B -m pytest tests -q -p no:cacheprovider
      - run: git diff --exit-code
