name: ARN reviewed-library Linux verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  library-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - name: Isolated virtual environment
        run: python -m venv .venv
      - name: Hash-verified CI dependencies
        run: |
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.lock
      - name: Dependency consistency
        run: .venv/bin/python -m pip check
      - name: Exact Python and MCP identity
        run: .venv/bin/python -c "import sys,importlib.metadata as m; assert sys.version_info[:3] == (3,14,4); assert m.version('mcp') == '2.3.0'; print(sys.version); print('mcp=' + m.version('mcp'))"
      - name: Synthetic library, admission regression and six wrapped contracts
        run: .venv/bin/python -m pytest -q --tb=short -p no:cacheprovider tests/test_library_lifecycle.py tests/test_reviewed_library.py tests/test_release_quota.py tests/test_tool_response_boundaries.py::test_signatures_preserved --junitxml=/tmp/arn-library-results.xml
      - name: Sources unchanged by tests
        run: git diff --exit-code
      - name: Independent root writer and non-root reader on synthetic files only
        run: sudo .venv/bin/python -I -B tests/verify_lifecycle_permissions.py
